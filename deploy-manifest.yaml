# MatchCoreArena-VelocityGate 部署声明（deploy-manifest v1）
# schema 依据：HA-Cupbearer internal/manifest/（SchemaVersion=1）
#
# kind=plugin：插件型产物（Velocity 代理插件 jar），装进 Velocity 代理进程，
# 没有自己的进程/端口/健康面。编排器对插件条目只登记与校验、不执行安装
# （阶段未设）；安装步骤见 HRPAuth-Wiki deploy/matchcorearena-velocitygate.md。
manifest_version: 1
kind: plugin
project: velocitygate
display_name: MatchCoreArena-VelocityGate
group: edge
# pom 版本 1.0.0（velocity-plugin.json id velocitygate）；仓库无 git 版本 tag。
service_version: "1.0.0"

facts:
  depends_on:
    # 路由判定依赖 MCA 的 OPS 分配查询端点 GET /api/matchmaking/assignment/{uuid}
    # （契约 1.9.1）。MCA 不可达时插件降级为全员留大厅（不阻断登录），
    # 但"先有 MCA 再谈路由"的部署序关系仍按 required 登记。
    - project: mca-server
      kind: required
  migration:
    mode: none

plugin:
  # 承载运行时：Velocity 代理。生态内当前没有可编排的 Velocity 实例，
  # target_project 留空、仅以 runtime 描述；将来代理项目入编排体系后
  # 填入其项目名（聚合校验会强制它存在）。
  runtime: velocity-proxy
  # Velocity 的插件目录（相对代理工作目录）。
  plugins_dir: plugins
  artifact:
    # mvn -B package 产物（Java 17，velocity-api 3.4.0 provided）。
    source: local_path
    local_path: target/velocitygate-1.0.0.jar
